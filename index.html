<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRL · Dia 5 (B21–B25)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ds-allow-hardcode:start — full autònom: sense sistema de disseny extern; colors tokenitzats a :root */
:root{
  --ink:#10293a; --ink-2:#2c4556; --muted:#516776; --paper:#eef2f4; --surface:#ffffff; --line:#cfd9df; --line-2:#e3e9ec;
  --blue:#1d5aa0; --blue-bg:#e7eff9; --blue-ink:#123f73;
  --yellow:#f0c000; --yellow-bg:#fff5c7; --yellow-ink:#4a3a00;
  --green:#1b7343; --green-bg:#e3f3e9; --green-ink:#0f4d2b;
  --red:#b42318; --red-bg:#fdecea; --red-ink:#7a1710;
  --focus:#ff8a00;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-head:"Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --r-s:4px; --r-m:8px;
  --measure:72ch;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;margin:0;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.5rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- capçalera ---------- */
.top{background:var(--ink);color:#fff}
.top-in{max-width:1240px;margin:0 auto;padding:14px 16px 0;display:grid;gap:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand-mark{flex:none;width:46px;height:46px}
.brand h1{font-size:1.65rem;font-weight:700}
.brand p{margin:0;color:#c3d3dc;font-size:.92rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #6d8796;border-radius:var(--r-s);overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:.35rem .7rem;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.tbtn{background:transparent;border:1px solid #6d8796;color:#fff;border-radius:var(--r-s);padding:.35rem .7rem;cursor:pointer}
.tbtn:hover{border-color:#fff}
.tbtn.on{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:700}
.daybar{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:#dbe6ec}
.daybar strong{color:#fff}
.student-chip{color:#fff;font-weight:700}
.student-chip.empty{color:#ffd48a;font-weight:400}

/* ruta de sessions */
.route{position:relative;display:flex;gap:0;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
.route button{flex:1 0 auto;min-width:118px;background:transparent;border:0;border-top:4px solid transparent;color:#c3d3dc;
  padding:.55rem .8rem .7rem;text-align:left;cursor:pointer;display:grid;gap:2px}
.route button:hover{color:#fff}
.route button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:var(--yellow)}
.route .rid{font-family:var(--f-head);font-weight:700;font-size:1.25rem;line-height:1}
.route .rmeta{font-size:.78rem;display:flex;gap:6px;align-items:center}
.dotp{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.dotp.part{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.dotp.full{background:currentColor}

/* ---------- disposició ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 64px}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.grid > *,.top-in > *{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.toc h2{font-size:1.05rem;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:flex;gap:6px;padding:4px 6px;border-radius:var(--r-s);text-decoration:none;color:var(--ink-2)}
.toc li a:hover{background:var(--paper)}
.toc .tk{flex:none;width:8px;margin-top:8px;height:8px;border-radius:2px;background:var(--line)}
.toc .tk.activity,.toc .tk.selfcheck{background:var(--blue)}
.toc .tk.summary{background:var(--ink)}
.toc details{margin-top:4px}
@media (max-width:900px){.toc details:not([open]) ol{display:none}}

.main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:1.5rem;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field textarea,.field select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.5rem .6rem;background:#fff;width:100%}
.field textarea{min-height:5.5rem;resize:vertical}
.hint{color:var(--muted);font-size:.88rem;margin:.2rem 0 0}
.req{color:var(--red)}

/* capçalera de sessió */
.shead{display:grid;gap:10px;margin-bottom:18px}
.shead .kicker{font-family:var(--f-head);font-size:1.15rem;color:var(--muted);font-weight:600}
.shead h2{font-size:clamp(2rem,4.2vw,3rem);font-weight:700;max-width:24ch}
.metas{display:flex;flex-wrap:wrap;gap:8px}
.meta{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:.25rem .55rem;font-size:.86rem}
.meta b{font-weight:700}
.meta.warn{border-color:var(--yellow);background:var(--yellow-bg);color:var(--yellow-ink)}

/* seccions de contingut */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:14px;padding:18px 22px;scroll-margin-top:12px}
.sec > h3{font-size:1.45rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.sec > h3 .n{color:var(--muted);font-weight:600;min-width:1.6em}
.kindtag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:.78rem;font-weight:700;padding:.1rem .45rem;border-radius:var(--r-s);
  background:var(--paper);color:var(--ink-2);vertical-align:middle;margin-left:auto;white-space:nowrap}
.kindtag svg{width:14px;height:14px}
.sec.k-example{border-left:6px solid #6b8aa0}
.sec.k-objectives{border-left:6px solid var(--ink)}
.sec.k-summary{background:#f6f9fb;border-left:6px solid var(--ink)}
.sec.k-activity,.sec.k-selfcheck{border-left:6px solid var(--blue)}
.prose{max-width:none}
.prose > p,.prose > h4,.prose > ul:not(.bal),.prose > ol:not(.bal):not(.arrows),.prose > .flow,.prose > .box,.prose > .tablewrap{max-width:var(--measure)}
.prose p{margin:.45rem 0}
.prose h4{font-size:1.2rem;margin:1rem 0 .3rem;color:var(--ink-2)}
.prose ul,.prose ol{margin:.35rem 0 .6rem;padding-left:1.4rem}
.prose li{margin:.15rem 0}
.prose li::marker{color:var(--muted)}
.prose .l2{padding-left:2.6rem}
.prose .l0{padding-left:1.6rem}
.tablewrap{overflow-x:auto;margin:.7rem 0;border:1px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
thead th{background:var(--ink);color:#fff;font-weight:700}
tbody tr:nth-child(even) td{background:#f7f9fa}
.flow{display:grid;justify-items:start;gap:0;margin:.8rem 0;padding:.2rem 0}
.flow .st{border:2px solid var(--ink);border-radius:var(--r-s);padding:.3rem .7rem;font-weight:700;background:#fff;max-width:var(--measure)}
.flow .ar{width:2px;height:14px;background:var(--ink);margin-left:22px;position:relative}
.flow .ar::after{content:"";position:absolute;bottom:-5px;left:-4px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.flow .tx{padding:.15rem 0 .15rem .3rem;color:var(--ink-2)}
details.assess{margin-top:.4rem}
details.assess > summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.srcnote{font-size:.82rem;color:var(--muted);margin-top:.6rem}

/* vídeos */
.video{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px dashed #8aa0ad;border-radius:var(--r-m);padding:12px 14px;margin:12px 0;background:#f8fafb}
.video .vi{width:40px;height:40px;border-radius:var(--r-s);background:var(--ink);color:#fff;display:grid;place-items:center}
.video h4{font-size:1.15rem;margin-bottom:2px}
.video .vm{font-size:.86rem;color:var(--muted)}
.video .ver{font-weight:700;font-size:.8rem;padding:.05rem .35rem;border-radius:var(--r-s)}
.video .ver.ok{background:var(--green-bg);color:var(--green-ink)}
.video .ver.no{background:var(--yellow-bg);color:var(--yellow-ink)}

/* ---------- activitats ---------- */
.act{border:2px solid var(--line);border-radius:var(--r-m);margin:14px 0;background:#fff;overflow:hidden}
.act-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.act-h h4{font-size:1.25rem;flex:1 1 260px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;padding:.2rem .5rem;border-radius:var(--r-s);white-space:nowrap}
.badge svg{width:16px;height:16px;flex:none}
.act.t-auto{border-color:var(--blue)} .act.t-auto .act-h{background:var(--blue-bg)} .b-auto{background:var(--blue);color:#fff}
.act.t-teacher{border-color:var(--yellow)} .act.t-teacher .act-h{background:var(--yellow-bg)} .b-teacher{background:var(--yellow);color:#231b00}
.act.t-class{border-color:var(--green)} .act.t-class .act-h{background:var(--green-bg)} .b-class{background:var(--green);color:#fff}
.b-origin{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:400}
.act-b{padding:12px 14px}
.act-meta{font-size:.84rem;color:var(--muted);margin:0 0 8px}
.instr{margin:0 0 10px;max-width:var(--measure)}
.q{border-top:1px solid var(--line-2);padding:10px 0}
.q:first-of-type{border-top:0}
.q legend,.q .ql{font-weight:700;padding:0;margin-bottom:6px;max-width:var(--measure)}
fieldset.q{border:0;margin:0;min-width:0;border-top:1px solid var(--line-2)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:var(--r-s);cursor:pointer;max-width:var(--measure)}
.opt:hover{background:var(--paper)}
.opt input{margin-top:.35rem;width:18px;height:18px;flex:none}
.opt.is-right{background:var(--green-bg)}
.opt.is-wrong{background:var(--red-bg)}
.fb{margin-top:6px;padding:6px 10px;border-radius:var(--r-s);font-size:.95rem;display:flex;gap:8px;align-items:flex-start}
.fb svg{width:18px;height:18px;flex:none;margin-top:3px}
.fb.ok{background:var(--green-bg);color:var(--green-ink)}
.fb.ko{background:var(--red-bg);color:var(--red-ink)}
.row-sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,280px) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
@media (max-width:620px){.row-sel{grid-template-columns:1fr}}
.row-sel select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.4rem;background:#fff;width:100%}
.mark{font-weight:700;font-size:.85rem;display:inline-flex;gap:4px;align-items:center}
.mark.ok{color:var(--green)} .mark.ko{color:var(--red)}
.mark svg{width:16px;height:16px}
.order li{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);margin:6px 0;background:#fff}
.order{list-style:none;padding:0;margin:0;counter-reset:o}
.order li::before{counter-increment:o;content:counter(o);font-family:var(--f-head);font-weight:700;font-size:1.2rem;min-width:1.4em;color:var(--muted)}
.order .ot{flex:1}
.order button{border:1px solid #9aabb6;background:#fff;border-radius:var(--r-s);width:34px;height:34px;cursor:pointer}
.order button:disabled{opacity:.35;cursor:default}
.order li.ok{border-color:var(--green);background:var(--green-bg)}
.order li.ko{border-color:var(--red);background:var(--red-bg)}
.act-f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fafbfc}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-s);padding:.45rem .9rem;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.btn.big{font-size:1.05rem;padding:.6rem 1.1rem}
.btn.warn{background:#fff;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.score{font-weight:700}
.scorebox{font-size:.92rem;color:var(--ink-2)}
.how{font-size:.82rem;color:var(--muted);width:100%}
.gridin{width:100%;border-collapse:collapse}
.gridin td,.gridin th{border:1px solid var(--line);padding:4px}
.gridin textarea{width:100%;min-height:3.2rem;border:0;resize:vertical;padding:4px}
.status{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.86rem;padding:.15rem .5rem;border-radius:var(--r-s);border:1px solid var(--line)}
.status.pend{background:#fff}
.status.lliu{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
.status.rev{background:var(--green-bg);border-color:var(--green);color:var(--green-ink)}
.tbox{margin-top:12px;border:2px dashed var(--yellow);border-radius:var(--r-m);padding:10px 12px;background:#fffcf0}
.tbox h5{margin:0 0 6px;font-family:var(--f-head);font-size:1.1rem}
.tbox .ro{color:var(--muted);font-style:italic}
.tbox .form-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:20px;height:20px}

.nav-s{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.final-h{font-size:1.6rem;margin:26px 0 8px}

/* banda del docent */
.tband{background:var(--yellow);color:#231b00;font-weight:700;text-align:center;padding:6px 12px;font-size:.92rem}

/* progrés */
.prog-table td,.prog-table th{white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;min-width:90px}
.bar > i{display:block;height:100%;background:var(--blue)}

/* informe */
.overlay{position:fixed;inset:0;background:rgba(10,25,35,.55);z-index:50;display:none;overflow:auto;padding:24px 12px}
.overlay.open{display:block}
.sheet{max-width:900px;margin:0 auto;background:#fff;border-radius:var(--r-m);padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:1.9rem}
.rep h3{font-size:1.35rem;margin:18px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.rep h4{font-size:1.1rem;margin:12px 0 4px}
.rep table{font-size:.88rem}
.rep .src-a{color:var(--blue-ink);font-weight:700}
.rep .src-t{color:#6b5300;font-weight:700}
.rep .ans{white-space:pre-wrap;background:#f6f8f9;border-left:3px solid var(--line);padding:4px 8px;margin:4px 0;font-size:.88rem}
.legend{font-size:.86rem;border:1px solid var(--line);padding:6px 10px;border-radius:var(--r-s);background:#f8fafb}
#copyfallback{width:100%;min-height:240px;font:400 .85rem/1.4 ui-monospace,Menlo,monospace;margin-top:10px;display:none}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:var(--r-s);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw}
#toast.show{opacity:1}
.foot{max-width:1240px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.86rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  body.print-report .top,body.print-report .wrap,body.print-report .foot,body.print-report .tband,body.print-report .sheet-top,body.print-report #toast{display:none!important}
  body.print-report .overlay{position:static;display:block;background:none;padding:0}
  body.print-report .sheet{box-shadow:none;padding:0;max-width:none}
  .rep h3{break-after:avoid}
  .rep tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}

/* ---------- portada de bloc (placa de senyalització) ---------- */
.cover{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 26px;background:var(--ink);color:#fff;border-radius:var(--r-m);
  padding:22px 24px 34px;overflow:hidden}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
.cv-id{display:grid;align-content:start;gap:2px}
.cv-code{font-family:var(--f-head);font-weight:700;font-size:clamp(3.4rem,8vw,5.6rem);line-height:.86;color:var(--yellow);letter-spacing:-.01em}
.cv-sub{font-size:.84rem;color:#c3d3dc;white-space:nowrap}
.cv-main{min-width:0;display:grid;gap:10px;align-content:start}
.cover h2{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:700;max-width:28ch;color:#fff}
.cv-lead{margin:0;color:#dbe6ec;max-width:60ch}
.cv-signs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 18px}
.cv-signs li{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;color:#fff;max-width:15rem;line-height:1.25}
.cv-signs .sign{width:46px;height:46px}
.cv-art{width:170px;align-self:end;margin:-6px 0 -22px;line-height:0}
.cv-art svg{width:100%;height:auto}
.anim .cover:not(.in) .cv-art{opacity:0}
.anim .cover.in .cv-art{animation:rise .7s cubic-bezier(.2,.7,.2,1) both .1s}
@media (max-width:980px){.cv-art{width:130px}}
@media (max-width:760px){.cv-art{display:none}}
@media (max-width:620px){.cover{grid-template-columns:1fr;padding:18px 16px 30px}.cv-sub{white-space:normal}}
.pres-btn{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.pres-btn svg{width:16px;height:16px}

/* senyals */
.sign{display:inline-block;flex:none;width:44px;height:44px;line-height:0}
.sign svg{width:100%;height:100%;overflow:visible}

/* ---------- infografies ---------- */
.viz{margin:14px 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:#f7fafb}
.viz-t{font-size:1.15rem;margin:0 0 10px;color:var(--ink)}
.viz figcaption{font-size:.84rem;color:var(--muted);margin-top:8px}
.ct{display:grid;gap:2px;min-width:0}
.ct strong{font-family:var(--f-head);font-size:1.12rem;line-height:1.15;font-weight:700}
.ct span{font-size:.92rem;color:var(--ink-2);line-height:1.4}
.num{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:700;font-size:1.2rem}

/* cadena de procés */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0}
.chain li{position:relative;display:grid;justify-items:center;text-align:center;gap:8px;padding:4px 14px}
.chain li + li::before{content:"";position:absolute;left:-9px;top:20px;width:18px;height:3px;background:var(--ink)}
.chain li + li::after{content:"";position:absolute;left:5px;top:15px;border:6.5px solid transparent;border-left:8px solid var(--ink)}
.chain .ct{justify-items:center}
@media (max-width:760px){
  .chain{grid-auto-flow:row}
  .chain li{grid-template-columns:auto 1fr;justify-items:start;text-align:left;padding:8px 0 8px 0}
  .chain .ct{justify-items:start}
  .chain li + li::before{left:21px;top:-6px;width:3px;height:12px}
  .chain li + li::after{left:16px;top:2px;border:6.5px solid transparent;border-top:8px solid var(--ink);border-bottom:0}
}
/* passos verticals */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:8px 0;position:relative}
.steps li + li::before{content:"";position:absolute;left:20px;top:-10px;height:18px;width:3px;background:var(--line)}

/* targetes */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cards.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cards.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card .cn{position:absolute;top:4px;right:8px;font-family:var(--f-head);font-weight:700;font-size:1.05rem;color:var(--muted)}
.card{position:relative;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-top:5px solid var(--ink);border-radius:var(--r-s);padding:10px 12px}
.card.s-ghs{border-top-color:var(--red)} .card.s-warn{border-top-color:var(--yellow)} .card.s-must{border-top-color:var(--blue)} .card.s-ban,.card.s-fire{border-top-color:var(--red)} .card.s-safe{border-top-color:var(--green)}

/* comparació */
.compare{display:grid;gap:10px;align-items:stretch}
.compare.n2{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.compare.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.compare.n4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.compare.n5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.compare.n2:not(:has(.vs)){grid-template-columns:repeat(2,minmax(0,1fr))}
.compare .col{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:12px;border-left:6px solid var(--ink)}
.compare .col.s-warn{border-left-color:var(--yellow)} .compare .col.s-must{border-left-color:var(--blue)} .compare .col.s-ban,.compare .col.s-fire{border-left-color:var(--red)} .compare .col.s-safe{border-left-color:var(--green)}
.col-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.col-h strong{font-family:var(--f-head);font-size:1.25rem;line-height:1.1}
.col p{margin:.2rem 0 .4rem;font-size:.95rem}
.col ul{margin:0;padding-left:1.1rem;font-size:.95rem}
.vs{align-self:center;font-family:var(--f-head);font-weight:700;font-size:1.3rem;color:var(--muted)}
@media (max-width:760px){.compare.n2,.compare.n3,.compare.n2:not(:has(.vs)){grid-template-columns:1fr}.vs{justify-self:center}}

/* piràmide (jerarquia) */
.pyr ol{list-style:none;margin:0 auto;padding:0;display:grid;gap:5px;justify-items:center}
.pyr li{width:var(--w);min-width:min(100%,250px)}
.pyr .lvl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;padding:9px 14px;color:#fff;
  background:color-mix(in srgb,var(--green) calc(100% - var(--k) * 18%),var(--ink));clip-path:polygon(0 0,100% 0,97% 100%,3% 100%)}
.pyr .lvl strong{font-family:var(--f-head);font-size:1.15rem}
.pyr .lvl span{font-size:.88rem;opacity:.95}
.pyr .pi{width:22px;height:22px;display:inline-block}
.pyr .pi svg{width:100%;height:100%}
.axis{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin:8px 0 0;font-weight:700}
.axis span:first-child::before{content:"▲ "}
.axis span:last-child::after{content:" ▼"}

/* cicle */
.cycle{list-style:none;margin:0 auto;padding:0;position:relative;width:min(100%,460px);aspect-ratio:1}
.cycle.n3{width:min(100%,400px)}
.cycle::before{content:"";position:absolute;inset:12%;border:3px dashed var(--line);border-radius:50%}
.cycle li{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:34%;display:grid;justify-items:center;text-align:center;gap:4px;
  background:#f7fafb;padding:4px}
.cycle li strong{font-family:var(--f-head);font-size:1.08rem;line-height:1.1}
.cycle li span{font-size:.84rem;line-height:1.3;color:var(--ink-2)}
.cycle .hub{left:50%;top:50%;width:30%;background:var(--ink);color:#fff;border-radius:50%;aspect-ratio:1;place-content:center;font-family:var(--f-head);font-weight:700;font-size:1.1rem;padding:8px}
@media (max-width:620px){
  .cycle{aspect-ratio:auto;display:grid;gap:8px}
  .cycle::before,.cycle .hub{display:none}
  .cycle li{position:static;transform:none;width:auto;grid-template-columns:auto 1fr;justify-items:start;text-align:left;align-items:center}
  .cycle li span{grid-column:2}
}

/* xifra o definició clau */
.keyf{display:flex;gap:14px;align-items:flex-start}
.keyf .sign{width:56px;height:56px}
.keyf .big{font-family:var(--f-head);font-weight:700;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1;margin:0 0 6px}
.keyf blockquote{margin:0;font-size:1.05rem;border-left:4px solid var(--ink);padding:2px 0 2px 12px;max-width:var(--measure)}
.keyf.s-warn blockquote{border-left-color:var(--yellow)} .keyf.s-must blockquote{border-left-color:var(--blue)} .keyf.s-ban blockquote,.keyf.s-fire blockquote{border-left-color:var(--red)} .keyf.s-safe blockquote{border-left-color:var(--green)}
.keyf .src{font-size:.84rem;color:var(--muted);margin:6px 0 0}

/* barres */
.bars{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bars li{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:10px;align-items:center}
.bl{font-weight:700;font-size:.93rem}
.bt{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.bt i{flex:none}
.bt i{display:block;height:22px;width:calc(var(--v) * .62);border-radius:0 var(--r-s) var(--r-s) 0;background:var(--ink)}
.bt i.s-warn{background:var(--yellow)} .bt i.s-must{background:var(--blue)} .bt i.s-ban,.bt i.s-fire{background:var(--red)} .bt i.s-safe{background:var(--green)}
.bt b{font-size:.9rem;min-width:0;line-height:1.25}
@media (max-width:620px){.bars li{grid-template-columns:1fr}}

/* matriu */
.mtx th[scope=row]{background:#f2f5f7}
.mtx td{text-align:center;font-weight:700}
.mtx .lv1{background:#dff1e5!important;color:var(--green-ink)}
.mtx .lv2{background:#eef7d9!important;color:#3d5110}
.mtx .lv3{background:var(--yellow-bg)!important;color:var(--yellow-ink)}
.mtx .lv4{background:#ffe1c2!important;color:#6b3300}
.mtx .lv5{background:#f9d0cc!important;color:var(--red-ink)}

/* termes del manual */
.terms{list-style:none;margin:.6rem 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;max-width:none}
.terms li{margin:0;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r-s);padding:8px 12px;display:grid;gap:2px}
.terms strong{font-family:var(--f-head);font-size:1.12rem;line-height:1.15}
.terms span{font-size:.95rem}

details.fulltext{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
details.fulltext > summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:8px 12px;display:flex;gap:8px;align-items:center}
details.fulltext > summary svg{width:18px;height:18px;flex:none}
details.fulltext[open] > summary{border-bottom:1px solid var(--line-2)}
details.fulltext > .prose{padding:4px 14px 8px}
/* frases «A → B → C» del manual */
.prose ol.arrows,ol.arrows{list-style:none;margin:.7rem 0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0}
ol.arrows li{margin:0;background:var(--ink);color:#fff;font-weight:700;font-size:.95rem;padding:.35rem .7rem;border-radius:var(--r-s);position:relative}
ol.arrows li + li{margin-left:22px}
ol.arrows li + li::before{content:"";position:absolute;left:-17px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:9px solid var(--ink)}
.anim ol.arrows:not(.in) li{opacity:0}
.anim ol.arrows.in li{animation:rise .45s ease-out both;animation-delay:calc(var(--d,0) * 110ms)}
/* procés del manual (diagrames ↓) */
.flow .st{position:relative}

/* ---------- animació d'entrada (un sol cop) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
.anim .viz:not(.in) li,.anim .viz:not(.in) .col,.anim .viz:not(.in) .keyf,.anim .viz:not(.in) td,
.anim .flow:not(.in) > *,.anim .terms:not(.in) li,.anim .cover:not(.in) .cv-signs li{opacity:0}
.anim .viz.in li,.anim .viz.in .col,.anim .viz.in .keyf,.anim .terms.in li{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 110ms)}
.anim .viz.in td{animation:rise .4s ease-out both;animation-delay:calc(var(--d,0) * 60ms)}
.anim .viz.in .sign{animation:pop .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 110ms + 80ms)}
.anim .viz.in .bt i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 120ms + 150ms)}
.anim .flow.in > *{animation:rise .45s ease-out both}
.anim .flow.in > :nth-child(2){animation-delay:.12s} .anim .flow.in > :nth-child(3){animation-delay:.24s} .anim .flow.in > :nth-child(4){animation-delay:.36s}
.anim .flow.in > :nth-child(5){animation-delay:.48s} .anim .flow.in > :nth-child(6){animation-delay:.6s} .anim .flow.in > :nth-child(7){animation-delay:.72s}
.anim .flow.in > :nth-child(n+8){animation-delay:.84s}
.anim .cover.in .cv-signs li{animation:pop .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 140ms + 150ms)}


/* ---------- mode presentació ---------- */
body.pres-on{overflow:hidden}
.pres{position:fixed;inset:0;z-index:70;background:var(--paper);display:grid;grid-template-rows:auto auto 1fr auto}
.pres-top{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:10px 18px}
.pres-top strong{font-family:var(--f-head);font-size:1.2rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pres-prog{height:5px;background:var(--line-2)} .pres-prog i{display:block;height:100%;background:var(--yellow);transition:width .3s}
.stage{overflow:auto;padding:28px clamp(16px,5vw,64px) 40px;outline:none}
.stage > *{max-width:1080px;margin:0 auto}
.stage .cover{min-height:60vh;align-content:center}
.stage .cover h2{font-size:clamp(2.2rem,5vw,3.6rem)}
.slide-in > h3{font-size:clamp(1.8rem,3.6vw,2.6rem);display:flex;gap:12px;margin-bottom:14px}
.slide-in > h3 .n{color:var(--muted)}
.slide-in .prose{font-size:1.2rem;max-width:none}
.slide-in .prose > p,.slide-in .prose > ul:not(.bal),.slide-in .prose > ol:not(.bal):not(.arrows){max-width:70ch}
.slide-in .viz{background:#fff;padding:18px 20px}
.slide-in .sign{width:62px;height:62px}
.slide-in .ct strong,.slide-in .col-h strong,.slide-in .cycle li strong,.slide-in .terms strong{font-size:1.45rem}
.slide-in .ct span,.slide-in .col ul,.slide-in .col p,.slide-in .terms span,.slide-in .cycle li span{font-size:1.08rem}
.slide-in .viz-t{font-size:1.4rem}
.slide-in .chain li + li::before{top:29px}.slide-in .chain li + li::after{top:24px}
.pres-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-top:1px solid var(--line)}
.count{font-family:var(--f-head);font-weight:700;font-size:1.2rem}
.pres:fullscreen{background:var(--paper)}

@media print{
  .anim .viz li,.anim .viz .col,.anim .flow > *,.anim .terms li,.anim .cover .cv-signs li,.anim td,.anim ol.arrows li{opacity:1!important;animation:none!important}
  .pres-btn{display:none}
}

/* ---------- «SmartArt» automàtic sobre el text del manual ---------- */
.prose h4.sub{font-size:1.12rem;margin:1.1rem 0 .35rem;padding-left:10px;border-left:4px solid var(--yellow);color:var(--ink);letter-spacing:.02em}
.box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;margin:.8rem 0;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:#f7fafb;max-width:var(--measure)}

.box-i svg{width:20px;height:20px}
.box-av{width:46px;height:46px;line-height:0}.box-av svg{width:100%;height:100%}
.box-h{margin:0 0 .2rem!important;font-family:var(--f-head);font-weight:700;font-size:1.08rem;letter-spacing:.02em}
.box-b > :first-child{margin-top:0}.box-b > :last-child{margin-bottom:0}
.box.b-example{border-left:6px solid #6b8aa0;background:#f3f6f8}.box.b-example .box-i{background:#6b8aa0}
.box.b-important{border-left:6px solid var(--red);background:var(--red-bg)}.box.b-important .box-i{background:var(--red)}

.box.inline{align-items:center}
ul.chips{list-style:none;padding:0!important;margin:.5rem 0 .8rem;display:flex;flex-wrap:wrap;gap:6px}

ul.chips li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--ink);flex:none}

ol.auto-steps li + li::before{content:"";position:absolute;left:14px;top:-8px;height:14px;width:3px;background:var(--line)}
.as-n{width:31px;height:31px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700}
ol.smart-goals,ul.smart-can{list-style:none;padding:0!important;margin:.6rem 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;max-width:none}

.anim .chips:not(.in) li,.anim .auto-steps:not(.in) li,.anim .smart-goals:not(.in) li,.anim .smart-can:not(.in) li,.anim .box:not(.in){opacity:0}
.anim .chips.in li,.anim .auto-steps.in li,.anim .smart-goals.in li,.anim .smart-can.in li{animation:rise .45s ease-out both;animation-delay:calc(var(--d,0) * 70ms)}

.prose ol.arrows,ol.arrows{flex-wrap:nowrap;align-items:stretch}

.box .tri{margin:12px auto 6px}

/* files equilibrades (--cols calculat a partir del nombre d'elements) */

venio colectivo corresponde realmente a la empresa antes de aplicarlo."],"ans":true},{"q":["Una referència genèrica a MARPOL substitueix la comprovació de la normativa ambiental aplicable.","Una referencia genérica a MARPOL sustituye la comprobación de la normativa ambiental aplicable."],"ans":false},{"q":["En l'àmbit laboral no basta conèixer la norma: cal traduir-la en un procediment de treball concret.","En el ámbito laboral no basta con conocer la norma: hay que traducirla en un procedimiento de trabajo concreto."],"ans":true}],"block":"B21","origin":"complementaria","ra":"RA2","ce":"c (principal, segons el manual)"}],"notes":[["Nota de correspondència: a partir de B21 els títols del manual no coincideixen amb els de la planificació del curs (on B21 figura com «Riscos de seguretat específics del sector»). La web segueix el manual, que és la font de contingut, i manté la numeració de blocs indicada.","Nota de correspondencia: a partir de B21 los títulos del manual no coinciden con los de la planificación del curso (donde B21 figura como «Riesgos de seguridad específicos del sector»). La web sigue el manual, que es la fuente de contenido, y mantiene la numeración de bloques indicada."]],"cover":{"signs":[["info","gavel",["Normativa general","Normativa general"]],["info","learn",["Normativa del títol","Normativa del título"]],["info","anchor",["Normes portuàries","Normas portuarias"]]],"lead":["La diferència és que, en l’àmbit laboral, no basta conèixer la norma: cal traduir-la en un procediment de treball concret, verificar que es compleix i corregir les desviacions detectades.","La diferencia es que, en el ámbito laboral, no basta con conocer la norma: hay que traducirla en un procedimiento de trabajo concreto, verificar que se cumple y corregir las desviaciones detectadas."]}},{"id":"B22","ud":"UD3","title":["ACCIDENTS DE TREBALL I MALALTIES PROFESSIONALS EN EL SECTOR TMV26","ACCIDENTES DE TRABAJO Y ENFERMEDADES PROFESIONALES EN EL SECTOR TMV26"],"meta":{"ra_fp":"RA2","ce_txt":"b (principal); a i c (complementaris)","ra_cert":"RA2 (competència t)","pes":"0,8333 %"},"sections":[{"num":0,"kind":"intro","title":null,"nodes":[{"t":"p","x":["Part III. Aplicació al sector de manteniment d’embarcacions de recreació","Parte III. Aplicación al sector de mantenimiento de embarcaciones de recreo"]}],"acts":[],"videos":[]},{"num":1,"kind":"objectives","title":["Què aprendrem?","¿Qué aprenderemos?"],"nodes":[{"t":"p","x":["En acabar aquest bloc, hauràs de ser capaç de:","Al acabar este bloque, tendrás que ser capaz de:"]},{"t":"list","k":"ul","l":1,"items":[["Diferenciar un accident de treball d’una malaltia professional.","Diferenciar un accidente de trabajo de una enfermedad profesional."],["Identificar accidents i patologies habituals en tallers, varadors i ports esportius.","Identificar accidentes y patologías habituales en talleres, varaderos y puertos deportivos."],["Reconèixer els supòsits d’accident IN ITINERE i en missió.","Reconocer los supuestos de accidente IN ITINERE y en misión."],["Relacionar una patologia amb l’activitat laboral i l’agent causant.","Relacionar una patología con la actividad laboral y el agente causante."],["Identificar els sistemes de notificació i registre esmentats en la normativa.","Identificar los sistemas de notificación y registro mencionados en la normativa."],["Explicar la importància d’investigar els accidents i aplicar mesures perquè no es repeteixin.","Explicar la importancia de investigar los accidentes y aplicar medidas para que no se repitan."]],"start":1,"smart":"goals"},{"t":"p","x":["2. Conceptes essencials","2. Conceptos esenciales"]},{"t":"p","x":["2.1. DANY DERIVAT DEL TREBALL","2.1. DAÑO DERIVADO DEL TRABAJO"]},{"t":"p","x":["D’acord amb l’article 4.3 de la Llei 31/1995, es consideren danys derivats del treball les malalties, patologies o lesions sofertes amb motiu o ocasió del treball.","De acuerdo con el artículo 4.3 de la Ley 31/1995, se consideran daños derivados del trabajo las enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo."]},{"t":"p","x":["En el manteniment nàutic, aquests danys poden derivar de caigudes, talls, atrapaments, exposició a productes químics, renou, vibracions, postures forçades o manipulació de càrregues.","En el mantenimiento náutico, estos daños pueden derivar de caídas, cortes, atrapamientos, exposición a productos químicos, ruido, vibraciones, posturas forzadas o manipulación de cargas."]},{"t":"p","x":["2.2. ACCIDENT DE TREBALL","2.2. ACCIDENTE DE TRABAJO"]},{"t":"p","x":["L’article 156 del text refós de la Llei general de la Seguretat Social regula el concepte legal d’accident de treball.","El artículo 156 del texto refundido de la Ley General de la Seguridad Social regula el concepto legal de accidente de trabajo."]},{"t":"p","x":["En el context del sector, en són exemples:","En el contexto del sector, son ejemplos:"]},{"t":"list","k":"ul","l":1,"items":[["Caure des de la coberta d’una embarcació situada sobre suports.","Caer desde la cubierta de una embarcación situada sobre soportes."],["Tallar-se amb una radial sense protecció adequada.","Cortarse con una radial sin protección adecuada."],["Patir un atrapament durant una maniobra amb un equip d’elevació.","Sufrir un atrapamiento durante una maniobra con un equipo de elevación."],["Rebre una descàrrega elèctrica durant una reparació.","Recibir una descarga eléctrica durante una reparación."]],"start":1,"smart":"goals"},{"t":"p","x":["L’accident sol materialitzar-se de manera sobtada, però la seva investigació ha de determinar les causes immediates i les causes organitzatives o tècniques que l’han fet possible.","El accidente suele materializarse de manera repentina, pero su investigación debe determinar las causas inmediatas y las causas organizativas o técnicas que lo han hecho posible."]},{"t":"p","x":["2.3. ACCIDENT in itinere I ACCIDENT EN MISSIÓ","2.3. ACCIDENTE in itinere Y ACCIDENTE EN MISIÓN"]},{"t":"list","k":"ul","l":1,"items":[["Accident in itinere: accident produït en el trajecte d’anada o tornada entre el domicili i el lloc de treball, sempre que es compleixin els requisits legals aplicables.","Accidente in itinere: accidente producido en el trayecto de ida o vuelta entre el domicilio y el lugar de trabajo, siempre que se cumplan los requisitos legales aplicables."],["Accident en missió: expressió utilitzada per descriure accidents ocorreguts durant desplaçaments o actuacions vinculats a una missió laboral. La seva qualificació jurídica depèn de les circumstàncies concretes.","Accidente en misión: expresión utilizada para describir accidentes ocurridos durante desplazamientos o actuaciones vinculados a una misión laboral. Su calificación jurídica depende de las circunstancias concretas."]],"start":1},{"t":"p","x":["En el sector nàutic, un tècnic pot haver de desplaçar-se entre ports esportius per reparar una avaria a bord. Aquest desplaçament pot formar part de la seva activitat professional, però la qualificació legal de l’accident s’ha d’analitzar cas per cas.","En el sector náutico, un técnico puede tener que desplazarse entre puertos deportivos para reparar una avería a bordo. Este desplazamiento puede formar parte de su actividad profesional, pero la calificación legal del accidente se debe analizar caso por caso."]},{"t":"p","x":["2.4. MALALTIA PROFESSIONAL","2.4. ENFERMEDAD PROFESIONAL"]},{"t":"p","x":["L’article 157 del text refós de la Llei general de la Seguretat Social regula el concepte legal de malaltia professional. El quadre oficial està aprovat pel Reial decret 1299/2006.","El artículo 157 del texto refundido de la Ley General de la Seguridad Social regula el concepto legal de enfermedad profesional. El cuadro oficial está aprobado por el Real Decreto 1299/2006."]},{"t":"p","x":["En el manteniment d’embarcacions, les exposicions que cal estudiar inclouen:","En el mantenimiento de embarcaciones, las exposiciones que hay que estudiar incluyen:"]},{"t":"list","k":"ul" ajo seguro, planificar la tarea e implantar las medidas de protección necesarias."]],"start":1},{"t":"p","x":["La probabilitat i el nivell final s’han de justificar amb l’avaluació real. La gravetat potencial elevada obliga a una actuació rigorosa encara que la caiguda no sigui freqüent.","La probabilidad y el nivel final se deben justificar con la evaluación real. La gravedad potencial elevada obliga a una actuación rigurosa aunque la caída no sea frecuente."]},{"t":"sub","x":["CAS 3. TAQUES D’OLI AL TALLER","CASO 3. MANCHAS DE ACEITE EN EL TALLER"]},{"t":"p","x":["Una taca d’oli ocupa una zona de pas utilitzada contínuament.","Una mancha de aceite ocupa una zona de paso utilizada continuamente."]},{"t":"list","k":"ul","l":1,"items":[["Perill: superfície relliscosa.","Peligro: superficie resbaladiza."],["Dany possible: caiguda, contusió o fractura.","Daño posible: caída, contusión o fractura."],["Mesura immediata: delimitar la zona, eliminar el vessament amb un procediment adequat i comprovar que el terra queda segur.","Medida inmediata: delimitar la zona, eliminar el derrame con un procedimiento adecuado y comprobar que el suelo queda seguro."],["Mesura organitzativa: establir un procediment de neteja i comunicació dels vessaments.","Medida organizativa: establecer un procedimiento de limpieza y comunicación de los derrames."]],"start":1}],"acts":[],"videos":[],"visuals":[{"type":"cards","title":["Tres casos del sector","Tres casos del sector"],"items":[{"i":"dust","s":"warn","x":["CAS 1. POLIT DE FIBRA DE VIDRE","CASO 1. PULIDO DE FIBRA DE VIDRIO"],"d":["Un tècnic poleix una peça de fibra de vidre. Es genera pols, no hi ha aspiració localitzada i la tasca es realitza repetidament sense protecció adequada.","Un técnico pule una pieza de fibra de vidrio. Se genera polvo, no hay aspiración localizada y la tarea se realiza repetidamente sin protección adecuada."]},{"i":"fall","s":"ban","x":["CAS 2. TREBALL A VUIT METRES D’ALTURA","CASO 2. TRABAJO A OCHO METROS DE ALTURA"],"d":["Una persona ha de fer una reparació en un pal sense un sistema d’accés segur ni mesures adequades de protecció contra caigudes.","Una persona debe hacer una reparación en un palo sin un sistema de acceso seguro ni medidas adecuadas de protección contra caídas."]},{"i":"slip","s":"warn","x":["CAS 3. TAQUES D’OLI AL TALLER","CASO 3. MANCHAS DE ACEITE EN EL TALLER"],"d":["Una taca d’oli ocupa una zona de pas utilitzada contínuament.","Una mancha de aceite ocupa una zona de paso utilizada continuamente."]}]}]},{"num":6,"kind":"theory","title":["De l’avaluació a les mesures preventives","De la evaluación a las medidas preventivas"],"nodes":[{"t":"p","x":["Una avaluació només és útil si permet prendre decisions.","Una evaluación solo es útil si permite tomar decisiones."]},{"t":"p","x":["La selecció de mesures ha de respectar els principis de l’acció preventiva de l’article 15 de la LPRL. Entre d’altres:","La selección de medidas debe respetar los principios de la acción preventiva del artículo 15 de la LPRL. Entre otros:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"xmark","s":"safe","x":["Evitar els riscos.","Evitar los riesgos."]},{"i":"search","s":"info","x":["Avaluar els riscos que no es puguin evitar.","Evaluar los riesgos que no se puedan evitar."]},{"i":"target","s":"safe","x":["Combatre els riscos en origen.","Combatir los riesgos en origen."]},{"i":"user","s":"info","x":["Adaptar el treball a la persona.","Adaptar el trabajo a la persona."]},{"i":"cycle","s":"safe","x":["Substituir allò perillós quan sigui possible per alternatives de menys risc.","Sustituir lo peligroso cuando sea posible por alternativas de menor riesgo."]}],"num":true}},{"t":"sub","x":["EXEMPLE: MANIPULACIÓ DE BATERIES","EJEMPLO: MANIPULACIÓN DE BATERÍAS"]},{"t":"p","x":["Si una bateria és massa pesada per manipular-la amb seguretat, no s’ha de confiar exclusivament en una instrucció per aixecar-la correctament.","Si una batería es demasiado pesada para manipularla con segurida :{"signs":[["warn","search",["Identificar el perill","Identificar el peligro"]],["warn","chart",["Probabilitat × conseqüència","Probabilidad × consecuencia"]],["must","checklist",["Prioritzar les mesures","Priorizar las medidas"]]],"lead":["Una avaluació només és útil si permet prendre decisions.","Una evaluación solo es útil si permite tomar decisiones."]}},{"id":"B24","ud":"UD3","title":["GESTIÓ I ORGANITZACIÓ DE LA PREVENCIÓ A L’EMPRESA","GESTIÓN Y ORGANIZACIÓN DE LA PREVENCIÓN EN LA EMPRESA"],"meta":{"ra_fp":"RA2","ce_txt":"pendents d'harmonitzar amb la taula mestra (indicació del manual)","ra_cert":"RA3 (competències t, v, w, z)","pes":"Pendent de confirmar (indicació del manual)"},"sections":[{"num":0,"kind":"intro","title":null,"nodes":[{"t":"p","x":["Part IV. Gestió de la prevenció","Parte IV. Gestión de la prevención"]}],"acts":[],"videos":[]},{"num":1,"kind":"objectives","title":["Què aprendrem?","¿Qué aprenderemos?"],"nodes":[{"t":"p","x":["En acabar aquest bloc, hauràs de ser capaç de:","Al acabar este bloque, tendrás que ser capaz de:"]},{"t":"list","k":"ul","l":1,"items":[["Explicar com s’integra la prevenció en l’organització d’una empresa.","Explicar cómo se integra la prevención en la organización de una empresa."],["Diferenciar les modalitats d’organització preventiva.","Diferenciar las modalidades de organización preventiva."],["Reconèixer les funcions del servei de prevenció i del recurs preventiu.","Reconocer las funciones del servicio de prevención y del recurso preventivo."],["Identificar els requisits bàsics de participació i representació de les persones treballadores.","Identificar los requisitos básicos de participación y representación de las personas trabajadoras."],["Explicar la funció dels delegats de prevenció i del Comitè de Seguretat i Salut.","Explicar la función de los delegados de prevención y del Comité de Seguridad y Salud."],["Proposar una estructura preventiva coherent amb la mida, l’activitat i els riscos d’una empresa nàutica.","Proponer una estructura preventiva coherente con el tamaño, la actividad y los riesgos de una empresa náutica."]],"start":1,"smart":"goals"}],"acts":[],"videos":[]},{"num":2,"kind":"theory","title":["Què significa gestionar la prevenció?","¿Qué significa gestionar la prevención?"],"nodes":[{"t":"p","x":["La gestió de la prevenció consisteix a integrar la seguretat i la salut en les decisions, els procediments i les activitats habituals de l’empresa.","La gestión de la prevención consiste en integrar la seguridad y la salud en las decisiones, los procedimientos y las actividades habituales de la empresa."]},{"t":"p","x":["No és suficient disposar d’un document preventiu arxivat. Cal que les mesures es tradueixin en actuacions reals, que hi hagi persones responsables i que se’n comprovi el compliment.","No es suficiente disponer de un documento preventivo archivado. Es necesario que las medidas se traduzcan en actuaciones reales, que haya personas responsables y que se compruebe su cumplimiento."]},{"t":"p","x":["En un taller de manteniment d’embarcacions, això implica integrar la prevenció en activitats com ara:","En un taller de mantenimiento de embarcaciones, esto implica integrar la prevención en actividades como:"]},{"t":"list","k":"ul","l":1,"items":[["Recepció i diagnòstic d’embarcacions.","Recepción y diagnóstico de embarcaciones."],["Ús de maquinària i eines.","Uso de maquinaria y herramientas."],["Manipulació de resines, pintures i dissolvents.","Manipulación de resinas, pinturas y disolventes."],["Operacions de varada i elevació.","Operaciones de varada y elevación."],["Treballs elèctrics i mecànics.","Trabajos eléctricos y mecánicos."],["Gestió dels residus.","Gestión de los residuos."],["Coordinació amb empreses subcontractades.","Coordinación con empresas subcontratadas."]],"start":1},{"t":"p","x":["Referències bàsiques: articles 14, 16, 30 i 31 de la Llei 31/1995, de prevenció de riscs laborals, i Reial decret 39/1997.","Referencias básicas: artículos 14, 16, 30 y 31 de la Ley 31/1995, de prevención de riesgos laborales, y Real Decreto 39/1997."]}],"acts":[],"videos":[]},{"num":3,"kind":"theory","title":["Les modalitats d’organització preventiva","Las modalidades de organización preventiva"],"nodes":[{"t":"p","x":["La normativa preveu diverses formes d’organitzar els recursos preventius. La modalitat adequada depèn de les característiques de l’empresa, de l’activitat i dels requisits legals.","La normativa prevé diversas formas de organizar los recursos preventivos. La modalidad adecuada depende de las características de la empresa, de la actividad y de los requisitos legales."]},{"t":"viz","v":{"type":"cards","title":["Les modalitats d'organització preventiva","Las modalidades de organización preventiva"],"items":[{"i":"boss","s":"info","x":["Assumpció personal per l’empresari o empresària","Asunción personal por el empresario o empresaria"],"d":["L’empresari assumeix directament les funcions preventives que legalment pot assumir, si compleix els requisits.","El empresario asume directamente las funciones preventivas que legalmente puede asumir, si cumple los requisitos."]},{"i":"user","s":"info","x":["Treballadors designats","Trabajadores designados"],"d":["Un o més treballadors assumeixen funcions preventives amb la formació, el temps i els mitjans necessaris.","Uno o más trabajadores asumen funciones preventivas con la formación, el tiempo y los medios necesarios."]},{"i":"building","s":"info","x":["Servei de Prevenció Propi (SPP)","Servicio de Prevención Propio (SPP)"],"d":["Estructura preventiva integrada en l’empresa, obligatòria en els supòsits previstos legalment.","Estructura preventiva integrada en la empresa, obligatoria en los supuestos previstos legalmente."]},{"i":"handshake","s":"info","x":["Servei de Prevenció Aliè (SPA)","Servicio de Prevención Ajeno (SPA)"],"d":["Entitat especialitzada externa amb la qual es concerten les activitats preventives corresponents.","Entidad especializada externa con la que se conciertan las actividades preventivas correspondientes."]},{"i":"group","s":"info","x":["Servei de Prevenció Mancomunat (SPM)","Servicio de Prevención Mancomunado (SPM)"],"d":["Servei compartit per empreses que compleixen les condicions normatives per constituir-lo.","Servicio compartido por empresas que cumplen las condiciones normativas para constituirlo."]}],"cols":2}},{"t":"p","x":["La denominació i el nombre de modalitats s’han d’interpretar segons l’article 10 del RD 39/1997. La seva aplicació concreta exigeix comprovar els requisits legals vigents.","La denominación y el número de modalidades se deben interpretar según el artículo 10 del RD 39/1997. Su aplicación concreta exige comprobar los requisitos legales vigentes."]},{"t":"sub","x":["3.1. ASSUMPCIÓ PERSONAL PER L’EMPRESARI O EMPRESÀRIA","3.1. ASUNCIÓN PERSONAL POR EL EMPRESARIO O EMPRESARIA"]},{"t":"p","x":["Aquesta modalitat no és automàtica pel fet que l’empresa sigui petita. Cal comprovar, entre altres condicions:","Esta modalidad no es automática por el hecho de que la empresa sea pequeña. Hay que comprobar, entre otras condiciones:"]},{"t":"list","k":"ul","l":1,"items":[["La dimensió de la plantilla i el nombre de centres.","La dimensión de la plantilla y el número de centros."],["Que l’activitat no estigui exclosa per la normativa aplicable.","Que la actividad no esté excluida por la normativa aplicable."],["La presència habitual de l’empresari al centre, quan sigui exigible.","La presencia habitual del empresario en el centro, cuando sea exigible."],["La formació i capacitat preventiva necessàries.","La formación y capacidad preventiva necesarias."],["Les activitats que legalment han de ser cobertes per altres recursos especialitzats.","Las actividades que legalmente deben ser cubiertas por otros recursos especializados."]],"start":1},{"t":"p","x":["La vigilància de la salut no es pot assumir personalment com una simple extensió de la resta de funcions preventives: s’ha de garantir mitjançant els recursos sanitaris competents.","La vigilancia de la salud no se puede asumir personalmente como una simple extensión del resto de funciones preventivas: se debe garantizar mediante los recursos sanitarios competentes."]},{"t":"sub","x":["3.2. TREBALLADORS DESIGNATS","3.2. TRABAJADORES DESIGNADOS"]},{"t":"p","x":["Els treballadors designats han de disposar de la capacitació, el temps i els mitjans adequats. La designació no elimina la responsabilitat de l’empresa de garantir una protecció eficaç.","Los trabajadores designados deben disponer de la capacitación, el tiempo y los medios adecuados. La designación no elimina la responsabilidad de la empresa de garantizar una protección eficaz."]},{"t":"sub","x":["3.3. SERVEI DE PREVENCIÓ PROPI","3.3. SERVICIO DE PREVENCIÓN PROPIO"]},{"t":"p","x":["Amb caràcter general, és obligatori en empreses de més de 500 treballadors i també en els supòsits previstos per a empreses d’entre 250 i 500 treballadors que desenvolupin activitats incloses en l’annex I del RD 39/1997. També pot ser exigit per l’autoritat laboral en els casos legalment establerts.","Con carácter general, es obligatorio en empresas de más de 500 trabajadores y también en los supuestos previstos para empresas de entre 250 y 500 trabajadores que desarrollen actividades incluidas en el anexo I del RD 39/1997. También puede ser exigido por la autoridad laboral en los casos legalmente establecidos."]},{"t":"p","x":["Per tant, no s’ha de determinar l’obligatorietat únicament a partir del nombre de treballadors sense comprovar l’activitat i la resta de condicions.","Por tanto, no se debe determinar la obligatoriedad únicamente a partir del número de trabajadores sin comprobar la actividad y el resto de condiciones."]},{"t":"sub","x":["3.4. SERVEI DE PREVENCIÓ ALIÈ","3.4. SERVICIO DE PREVENCIÓN AJENO"]},{"t":"p","x":["És una entitat especialitzada acreditada que pot desenvolupar les activitats preventives concertades. La concertació no eximeix l’empresa de les obligacions que li corresponen.","Es una entidad especializada acreditada que puede desarrollar las actividades preventivas concertadas. La concertación no exime a la empresa de las obligaciones que le corresponden."]},{"t":"sub","x":["3.5. SERVEI DE PREVENCIÓ MANCOMUNAT","3.5. SERVICIO DE PREVENCIÓN MANCOMUNADO"]},{"t":"p","x":["Permet compartir recursos preventius quan es compleixen els requisits legals. Les empreses participants han de comprovar que el servei disposa de la capacitat necessària per atendre les activitats i els riscos de cadascuna.","Permite compartir recursos preventivos cuando se cumplen los requisitos legales. Las empresas participantes deben comprobar que el servicio dispone de la capacidad necesaria para atender las actividades y los riesgos de cada una."]}],"acts":[],"videos":[]},{"num":4,"kind":"theory","title":["El recurs preventiu","El recurso preventivo"],"nodes":[{"t":"p","x":["El recurs preventiu és una figura destinada a vigilar el compliment de les activitats preventives en els supòsits previstos legalment.","El recurso preventivo es una figura destinada a vigilar el cumplimiento de las actividades preventivas en los supuestos previstos legalmente."]},{"t":"p","x":["La seva presència pot ser necessària, per exemple, en determinades operacions amb riscos especialment agreujats o quan hi ha concurrència d’activitats que fa necessari controlar l’aplicació dels procediments.","Su presencia puede ser necesaria, por ejemplo, en determinadas operaciones con riesgos especialmente agravados o cuando hay concurrencia de actividades que hace necesario controlar la aplicación de los procedimientos."]},{"t":"p","x":["En el sector TMV26, cal analitzar especialment:","En el sector TMV26, hay que analizar especialmente:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"crane","s":"warn","x":["Operacions de varada i elevació amb equips pesants.","Operaciones de varada y elevación con equipos pesados."]},{"i":"fall","s":"warn","x":["Treballs e dades definidas, recursos suficientes, comunicación y seguimiento. Contratar un servicio externo no elimina la responsabilidad de la dirección, de la misma manera que recibir asesoramiento técnico no sustituye la necesidad de tomar decisiones y cumplir los procedimientos."]]}]}]},{"num":9,"kind":"activity","title":["Activitat pràctica: dissenyam l’organització preventiva","Actividad práctica: diseñamos la organización preventiva"],"nodes":[{"t":"p","x":["Treballau en grups. Analitzau els tres casos i proposau una organització preventiva.","Trabajad en grupos. Analizad los tres casos y proponed una organización preventiva."]},{"t":"p","x":["CAS A. TALLER MECÀNIC AMB QUATRE TREBALLADORS","CASO A. TALLER MECÁNICO CON CUATRO TRABAJADORES"]},{"t":"p","x":["El taller repara motors, utilitza eines elèctriques i manipula productes químics. La direcció vol assumir personalment la prevenció.","El taller repara motores, utiliza herramientas eléctricas y manipula productos químicos. La dirección quiere asumir personalmente la prevención."]},{"t":"p","x":["Cal determinar:","Hay que determinar:"]},{"t":"list","k":"ul","l":1,"items":[["Quins requisits ha de complir la direcció.","Qué requisitos debe cumplir la dirección."],["Quines activitats pot assumir legalment.","Qué actividades puede asumir legalmente."],["Quines activitats o especialitats necessiten altres recursos.","Qué actividades o especialidades necesitan otros recursos."],["Quina documentació s’ha de revisar abans de decidir.","Qué documentación se debe revisar antes de decidir."]],"start":1},{"t":"p","x":["CAS B. VARADOR AMB 25 TREBALLADORS","CASO B. VARADERO CON 25 TRABAJADORES"]},{"t":"p","x":["L’empresa realitza reparacions mecàniques, pintat i operacions de varada. Hi ha personal propi i empreses subcontractades.","La empresa realiza reparaciones mecánicas, pintado y operaciones de varada. Hay personal propio y empresas subcontratadas."]},{"t":"p","x":["Cal proposar:","Hay que proponer:"]},{"t":"list","k":"ul","l" encias de cumplimiento normativo, responsabilidad, comunicación y participación."]],[["Evidències","Evidencias"],["Informe d’organització preventiva i proposta de participació.","Informe de organización preventiva y propuesta de participación."]],[["Instruments","Instrumentos"],["Rúbrica, llista de control i revisió de la justificació normativa.","Rúbrica, lista de control y revisión de la justificación normativa."]]]},{"t":"p","x":["Pes del bloc: pendent de confirmar. El contingut d’organització preventiva s’ha de relacionar amb els criteris i els pesos que s’estableixin definitivament per a la part de gestió de la prevenció, sense duplicar els pesos ja assignats a l’avaluació de riscos.","Peso del bloque: pendiente de confirmar. El contenido de organización preventiva se debe relacionar con los criterios y los pesos que se establezcan definitivamente para la parte de gestión de la prevención, sin duplicar los pesos ya asignados a la evaluación de riesgos."]},{"t":"sub","x":["RÚBRICA D’AVALUACIÓ","RÚBRICA DE EVALUACIÓN"]},{"t":"table","rows":[[["Indicador","Indicador"],["1. Inicial","1. Inicial"],["2. En desenvolupament","2. En desarrollo"],["3. Assolit","3. Logrado"],["4. Avançat","4. Avanzado"]],[["Identificació de modalitats","Identificación de modalidades"],["No les diferencia.","No las diferencia."],["Les diferencia parcialment.","Las diferencia parcialmente."],["Identifica les modalitats pertinents.","Identifica las modalidades pertinentes."],["Justifica la modalitat i les limitacions legals.","Justifica la modalidad y las limitaciones legales."]],[["Aplicació normativa","Aplicación normativa"],["No fonamenta la proposta.","No fundamenta la propuesta."],["Utilitza referències incompletes.","Utiliza referencias incompletas."],["Justifica les decisions amb normativa adequada.","Justifica las decisiones con normativa adecuada."],["Contrasta els requisits i identifica la informació que falta.","Contrasta los requisitos e identifica la información que falta."]],[[
