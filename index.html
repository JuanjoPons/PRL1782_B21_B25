 y los riesgos de la actividad."]}],"acts":[],"videos":[]}],"final":["B24-modal","B24-deleg","B24-vf"],"acts":[{"id":"B24-s9","block":"B24","type":"teacher","origin":"manual","title":["Dissenyam l'organització preventiva — informe dels tres casos","Diseñamos la organización preventiva — informe de los tres casos"],"fields":[["Cas A (taller amb 4 treballadors): requisits, activitats assumibles, altres recursos i documentació","Caso A (taller con 4 trabajadores): requisitos, actividades asumibles, otros recursos y documentación"],["Cas B (varador amb 25 treballadors): modalitat, coordinació, recursos i control de les operacions de risc","Caso B (varadero con 25 trabajadores): modalidad, coordinación, recursos y control de las operaciones de riesgo"],["Cas C (empresa amb 600 treballadors): condicions legals, estructura, delegats i seguiment","Caso C (empresa con 600 trabajadores): condiciones legales, estructura, delegados y seguimiento"],["Taula de funcions i responsabilitats","Tabla de funciones y responsabilidades"],["Proposta de participació i seguiment","Propuesta de participación y seguimiento"]],"rubric":["Quan les dades no siguin suficients, indica quina informació falta. Rúbrica de l'apartat 11.","Cuando los datos no sean suficientes, indica qué información falta. Rúbrica del apartado 11."],"ra":"RA2","ce":"pendents d'harmonitzar amb la taula mestra (indicació del manual)"},{"id":"B24-autoav","block":"B24","type":"teacher","origin":"manual","title":["Autoavaluació","Autoevaluación"],"instr":["El manual planteja aquestes preguntes obertes sense solucionari: respon-les i el docent les revisarà.","El manual plantea estas preguntas abiertas sin solucionario: respóndelas y el docente las revisará."],"fields":[["Quines modalitats d’organització preventiva preveu el RD 39/1997?","¿Qué modalidades de organización preventiva prevé el RD 39/1997?"],["Per què una empresa petita no pot assumir automàticament tota la prevenció?","¿Por qué una empresa pequeña no puede asumir automáticamente toda la prevención?"],["Quina funció té el recurs preventiu?","¿Qué función tiene el recurso preventivo?"],["Quina diferència hi ha entre un delegat de prevenció i un tècnic del servei de prevenció?","¿Qué diferencia hay entre un delegado de prevención y un técnico del servicio de prevención?"],["Quan és obligatori constituir el Comitè de Seguretat i Salut?","¿Cuándo es obligatorio constituir el Comité de Seguridad y Salud?"],["Per què contractar un servei de prevenció aliè no elimina les obligacions de l’empresa?","¿Por qué contratar un servicio de prevención ajeno no elimina las obligaciones de la empresa?"]],"ra":"RA2","ce":"pendents d'harmonitzar amb la taula mestra (indicació del manual)"},{"id":"B24-modal","type":"match","title":["Modalitats d'organització preventiva","Modalidades de organización preventiva"],"instr":["Relaciona cada modalitat amb la seva característica (taula de l'apartat 3).","Relaciona cada modalidad con su característica (tabla del apartado 3)."],"pairs":[{"a":["Assumpció personal per l'empresari","Asunción personal por el empresario"],"b":["L'empresari assumeix directament les funcions que legalment pot assumir","El empresario asume directamente las funciones que legalmente puede asumir"]},{"a":["Treballadors designats","Trabajadores designados"],"b":["Treballadors amb formació, temps i mitjans assumeixen funcions preventives","Trabajadores con formación, tiempo y medios asumen funciones preventivas"]},{"a":["Servei de Prevenció Propi","Servicio de Prevención Propio"],"b":["Estructura integrada a l'empresa, obligatòria en supòsits legals","Estructura integrada en la empresa, obligatoria en supuestos legales"]},{"a":["Servei de Prevenció Aliè","Servicio de Prevención Ajeno"],"b":["Entitat externa acreditada amb què es concerten activitats","Entidad externa acreditada con la que se conciertan actividades"]},{"a":["Servei de Prevenció Mancomunat","Servicio de Prevención Mancomunado"],"b":["Servei compartit per diverses empreses","Servicio compartido por varias empresas"]}],"block":"B24","origin":"complementaria","ra":"RA2","ce":"pendents d'harmonitzar amb la taula mestra (indicació del manual)"},{"id":"B24-deleg","type":"match","title":["Delegats de prevenció segons la plantilla","Delegados de prevención según la plantilla"],"instr":["Taula orientativa de l'apartat 7 (art. 35 LPRL).","Tabla orientativa del apartado 7 (art. 35 LPRL)."],"pairs":[{"a":["De 31 a 49 treballadors","De 31 a 49 trabajadores"],"b":["Un delegat de prevenció","Un delegado de prevención"]},{"a":["De 50 a 100 treballadors","De 50 a 100 trabajadores"],"b":["Dos delegats i Comitè de Seguretat i Salut","Dos delegados y Comité de Seguridad y Salud"]},{"a":["De 101 a 500 treballadors","De 101 a 500 trabajadores"],"b":["Tres delegats i Comitè de Seguretat i Salut","Tres delegados y Comité de Seguridad y Salud"]},{"a":["De 501 a 1.000 treballadors","De 501 a 1.000 trabajadores"],"b":["Quatre delegats i Comitè de Seguretat i Salut","Cuatro delegados y Comité de Seguridad y Salud"]}],"block":"B24","origin":"complementaria","ra":"RA2","ce":"pendents d'harmonitzar amb la taula mestra (indicació del manual)"},{"id":"B24-vf","type":"tf","title":["Vertader o fals","Verdadero o falso"],"questions":[{"q":["Contractar un servei de prevenció aliè elimina les obligacions preventives de l'empresa.","Contratar un servicio de prevención ajeno elimina las obligaciones preventivas de la empresa."],"ans":false},{"q":["El Comitè de Seguretat i Salut és obligatori en empreses o centres amb 50 o més treballadors.","El Comité de Seguridad y Salud es obligatorio en empresas o centros con 50 o más trabajadores."],"ans":true},{"q":["L'empresari pot assumir personalment la vigilància de la salut com qualsevol altra funció preventiva.","El empresario puede asumir personalmente la vigilancia de la salud como cualquier otra función preventiva."],"ans":false,"exp":["S'ha de garantir mitjançant els recursos sanitaris competents.","Se debe garantizar mediante los recursos sanitarios competentes."]},{"q":["La presència del recurs preventiu substitueix l'avaluació de riscos.","La presencia del recurso preventivo sustituye a la evaluación de riesgos."],"ans":false},{"q":["Haver completat una formació bàsica no habilita per assumir qualsevol activitat preventiva.","Haber completado una formación básica no habilita para asumir cualquier actividad preventiva."],"ans":true}],"block":"B24","origin":"complementaria","ra":"RA2","ce":"pendents d'harmonitzar amb la taula mestra (indicació del manual)"}],"notes":[["Nota de correspondència: en la planificació del curs B24 figura com «Avaluació de riscos i mesures preventives aplicades al sector»; el manual hi desenvolupa la gestió i l'organització de la prevenció (Part IV), tot i que la Web 5 el manté dins d'UD3 segons la distribució indicada. La web segueix el manual.","Nota de correspondencia: en la planificación del curso B24 figura como «Evaluación de riesgos y medidas preventivas aplicadas al sector»; el manual desarrolla la gestión y la organización de la prevención (Parte IV), aunque la Web 5 lo mantiene dentro de UD3 según la distribución indicada. La web sigue el manual."]],"cover":{"signs":[["info","boss",["Modalitats preventives","Modalidades preventivas"]],["must","user",["Recurs preventiu","Recurso preventivo"]],["safe","group",["Delegats i Comitè","Delegados y Comité"]]],"lead":["No és suficient disposar d’un document preventiu arxivat. Cal que les mesures es tradueixin en actuacions reals, que hi hagi persones responsables i que se’n comprovi el compliment.","No es suficiente disponer de un documento preventivo archivado. Es necesario que las medidas se traduzcan en actuaciones reales, que haya personas responsables y que se compruebe su cumplimiento."]}},{"id":"B25","ud":"UD4","title":["PLA DE PREVENCIÓ DE RISCOS LABORALS I INTEGRACIÓ","PLAN DE PREVENCIÓN DE RIESGOS LABORALES E INTEGRACIÓN"],"meta":{"ra_fp":"RA2","ce_txt":"vinculació provisional (el manual remet a la taula mestra; la planificació indica f per a B25)","ra_cert":"RA3","pes":"Pendent (la planificació indica 1,25 % per a B25 amb un altre contingut)"},"sections":[{"num":0,"kind":"intro","title":null,"nodes":[],"acts":[],"videos":[]},{"num":1,"kind":"objectives","title":["Què aprendrem?","¿Qué aprenderemos?"],"nodes":[{"t":"p","x":["En aquest bloc aprendràs a comprendre la funció del Pla de Prevenció de Riscos Laborals, identificar-ne els elements obligatoris i explicar com s’ha d’integrar la prevenció en les activitats quotidianes i en tots els nivells jeràrquics d’una empresa.","En este bloque aprenderás a comprender la función del Plan de Prevención de Riesgos Laborales, identificar sus elementos obligatorios y explicar cómo se debe integrar la prevención en las actividades cotidianas y en todos los niveles jerárquicos de una empresa."]},{"t":"p","x":["Aplicarem aquests conceptes a un taller de manteniment d’embarcacions de recreo, on les decisions sobre eines, productes químics, procediments de treball i organització de les tasques poden afectar directament la seguretat i la salut de la plantilla.","Aplicaremos estos conceptos a un taller de mantenimiento de embarcaciones de recreo, donde las decisiones sobre herramientas, productos químicos, procedimientos de trabajo y organización de las tareas pueden afectar directamente a la seguridad y la salud de la plantilla."]},{"t":"p","x":["Objectius d’aprenentatge","Objetivos de aprendizaje"]},{"t":"list","k":"ul","l":1,"items":[["Definir el Pla de Prevenció de Riscos Laborals i explicar-ne la finalitat.","Definir el Plan de Prevención de Riesgos Laborales y explicar su finalidad."],["Identificar els cinc elements que ha d’incloure el Pla de Prevenció.","Identificar los cinco elementos que debe incluir el Plan de Prevención."],["Diferenciar el Pla de Prevenció de l’avaluació de riscos i de la planificació preventiva.","Diferenciar el Plan de Prevención de la evaluación de riesgos y de la planificación preventiva."],["Explicar el principi d’integració de la prevenció en l’activitat i en l’estructura jeràrquica de l’empresa.","Explicar el principio de integración de la prevención en la actividad y en la estructura jerárquica de la empresa."],["Identificar els requisits generals de simplificació documental aplicables a determinades pimes.","Identificar los requisitos generales de simplificación documental aplicables a determinadas pymes."],["Elaborar una proposta bàsica de Pla de Prevenció adaptada a un taller nàutic.","Elaborar una propuesta básica de Plan de Prevención adaptada a un taller náutico."]],"start":1,"smart":"goals"}],"acts":[],"videos":[]},{"num":2,"kind":"theory","title":["Conceptes essencials","Conceptos esenciales"],"nodes":[{"t":"table","rows":[[["Concepte","Concepto"],["Definició","Definición"]],[["Pla de Prevenció de Riscos Laborals","Plan de Prevención de Riesgos Laborales"],["Instrument que integra la prevenció en el sistema general de gestió de l’empresa i defineix la seva política preventiva.","Instrumento que integra la prevención en el sistema general de gestión de la empresa y define su política preventiva."]],[["Integració de la prevenció","Integración de la prevención"],["Incorporació de la seguretat i la salut en les activitats, les decisions i tots els nivells jeràrquics de l’organització.","Incorporación de la seguridad y la salud en las actividades, las decisiones y todos los niveles jerárquicos de la organización."]],[["Avaluació de riscos","Evaluación de riesgos"],["Procés que permet identificar els riscos laborals i valorar-ne la importància per determinar les mesures necessàries.","Proceso que permite identificar los riesgos laborales y valorar su importancia para determinar las medidas necesarias."]],[["Planificació de l’activitat preventiva","Planificación de la actividad preventiva"],["Programació de les mesures preventives, amb assignació de responsables, terminis i recursos.","Programación de las medidas preventivas, con asignación de responsables, plazos y recursos."]],[["Procediment de treball segur","Procedimiento de trabajo seguro"],["Instrucció que estableix com s’ha de dur a terme una operació per reduir els riscos laborals.","Instrucción que establece cómo se debe llevar a cabo una operación para reducir los riesgos laborales."]],[["Revisió preventiva","Revisión preventiva"],["Procés de comprovació i actualització de les mesures i dels documents preventius quan sigui necessari.","Proceso de comprobación y actualización de las medidas y de los documentos preventivos cuando sea necesario."]],[["Simplificació documental","Simplificación documental"],["Possibilitat d’integrar determinats documents preventius en un document únic simplificat, quan es compleixen els requisits legals.","Posibilidad de integrar determinados documentos preventivos en un documento único simplificado, cuando se cumplen los requisitos legales."]]]},{"t":"sub","x":["3. Explicació dels conceptes","3. Explicación de los conceptos"]},{"t":"sub","x":["3.1. QUÈ ÉS EL PLA DE PREVENCIÓ?","3.1. ¿QUÉ ES EL PLAN DE PREVENCIÓN?"]},{"t":"p","x":["El Pla de Prevenció és l’eina organitzativa que estableix com s’integra la prevenció de riscos laborals en el funcionament de l’empresa. No ha de ser un document merament administratiu, sinó una referència pràctica per definir responsabilitats, procediments, recursos i objectius preventius.","El Plan de Prevención es la herramienta organizativa que establece cómo se integra la prevención de riesgos laborales en el funcionamiento de la empresa. No debe ser un documento meramente administrativo, sino una referencia práctica para definir responsabilidades, procedimientos, recursos y objetivos preventivos."]},{"t":"p","x":["Per exemple, en un taller nàutic ha de permetre determinar qui comprova els equips de treball, qui gestiona els equips de protecció individual (EPI), com s'organitzen les operacions de manteniment i qui supervisa les mesures preventives.","Por ejemplo, en un taller náutico debe permitir determinar quién comprueba los equipos de trabajo, quién gestiona los equipos de protección individual (EPI), cómo se organizan las operaciones de mantenimiento y quién supervisa las medidas preventivas."]},{"t":"p","x":["La direcció ha d’aprovar el Pla, l’estructura organitzativa l’ha d’assumir i la plantilla n’ha de conèixer els aspectes que afecten les seves funcions.","La dirección debe aprobar el Plan, la estructura organizativa lo debe asumir y la plantilla debe conocer los aspectos que afectan a sus funciones."]},{"t":"sub","x":["3.2. ELS CINC ELEMENTS DEL PLA DE PREVENCIÓ","3.2. LOS CINCO ELEMENTOS DEL PLAN DE PREVENCIÓN"]},{"t":"p","x":["D’acord amb l’article 2.2 del Reial decret 39/1997, el Pla ha d’incloure els elements següents:","De acuerdo con el artículo 2.2 del Real Decreto 39/1997, el Plan debe incluir los elementos siguientes:"]},{"t":"viz","v":{"type":"cards","title":["Els cinc elements del Pla (art. 2.2 RD 39/1997)","Los cinco elementos del Plan (art. 2.2 RD 39/1997)"],"items":[{"i":"building","s":"info","x":["Identificació de l'empresa","Identificación de la empresa"],"d":["Activitat, centres, plantilla","Actividad, centros, plantilla"]},{"i":"group","s":"info","x":["Estructura organitzativa","Estructura organizativa"],"d":["Funcions i responsabilitats preventives","Funciones y responsabilidades preventivas"]},{"i":"gear","s":"info","x":["Organització de la producció","Organización de la producción"],"d":["Processos, pràctiques i procediments","Procesos, prácticas y procedimientos"]},{"i":"shield","s":"info","x":["Organització de la prevenció","Organización de la prevención"],"d":["Modalitat preventiva i òrgans de representació","Modalidad preventiva y órganos de representación"]},{"i":"target","s":"info","x":["Política, objectius i recursos","Política, objetivos y recursos"],"d":["Compromisos, objectius de millora i recursos","Compromisos, objetivos de mejora y recursos"]}],"num":true}},{"t":"p","x":["Aquests elements han de descriure una organització realista, adaptada a l’activitat i a les dimensions de l’empresa.","Estos elementos deben describir una organización realista, adaptada a la actividad y a las dimensiones de la empresa."]},{"t":"sub","x":["3.3. INTEGRAR LA PREVENCIÓ EN L’ACTIVITAT QUOTIDIANA","3.3. INTEGRAR LA PREVENCIÓN EN LA ACTIVIDAD COTIDIANA"]},{"t":"p","x":["La prevenció no és una tasca aïllada que correspon exclusivament al servei de prevenció. Ha d’estar present en les decisions de direcció, en l’organització del treball, en les compres, en el manteniment i en l’execució de les operacions.","La prevención no es una tarea aislada que corresponde exclusivamente al servicio de prevención. Debe estar presente en las decisiones de dirección, en la organización del trabajo, en las compras, en el mantenimiento y en la ejecución de las operaciones."]},{"t":"p","x":["La integració té dues dimensions:","La integración tiene dos dimensiones:"]},{"t":"list","k":"ul","l":1,"items":[["Integració en les activitats: la seguretat es considera quan es planifiquen les tasques, es compren eines, se seleccionen productes o es modifiquen processos.","Integración en las actividades: la seguridad se considera cuando se planifican las tareas, se compran herramientas, se seleccionan productos o se modifican procesos."],["Integració en la jerarquia: cada nivell organitzatiu assumeix les responsabilitats preventives que li corresponen.","Integración en la jerarquía: cada nivel organizativo asume las responsabilidades preventivas que le corresponden."]],"start":1},{"t":"p","x":["Exemple: si el responsable de compres adquireix un dissolvent perquè és més econòmic, sense comprovar-ne els riscos ni les necessitats de ventilació, hi ha una fallada d’integració preventiva. La decisió de compra també ha de considerar les condicions de seguretat i salut.","Ejemplo: si el responsable de compras adquiere un disolvente porque es más económico, sin comprobar sus riesgos ni las necesidades de ventilación, hay un fallo de integración preventiva. La decisión de compra también debe considerar las condiciones de seguridad y salud."]},{"t":"sub","x":["3.4. DIFERENCIAR EL PLA, L’AVALUACIÓ I LA PLANIFICACIÓ","3.4. DIFERENCIAR EL PLAN, LA EVALUACIÓN Y LA PLANIFICACIÓN"]},{"t":"p","x":["Els tres instruments estan relacionats, però no són equivalents.","Los tres instrumentos están relacionados, pero no son equivalentes."]},{"t":"viz","v":{"type":"cards","items":[{"i":"doc","s":"info","x":["Pla de Prevenció","Plan de Prevención"],"d":["Organització i integració de la prevenció","Organización e integración de la prevención"]},{"i":"search","s":"warn","x":["Avaluació de riscos","Evaluación de riesgos"],"d":["Identifica i valora els riscos","Identifica y valora los riesgos"]},{"i":"calendar","s":"must","x":["Planificació preventiva","Planificación preventiva"],"d":["Mesures, responsables, terminis i recursos","Medidas, responsables, plazos y recursos"]}]}},{"t":"p","x":["L’avaluació i la planificació són instruments essencials per aplicar el Pla de Prevenció.","La evaluación y la planificación son instrumentos esenciales para aplicar el Plan de Prevención."]},{"t":"sub","x":["3.5. SIMPLIFICACIÓ DOCUMENTAL EN DETERMINADES PIMES","3.5. SIMPLIFICACIÓN DOCUMENTAL EN DETERMINADAS PYMES"]},{"t":"p","x":["La normativa preveu que les empreses de fins a 50 persones treballadores que no desenvolupin activitats incloses en l’annex I del RD 39/1997 puguin integrar en un document únic simplificat el Pla de Prevenció, l’avaluació de riscos i la planificació preventiva, sempre que es compleixin els requisits legals aplicables.","La normativa prevé que las empresas de hasta 50 personas trabajadoras que no desarrollen actividades incluidas en el anexo I del RD 39/1997 puedan integrar en un documento único simplificado el Plan de Prevención, la evaluación de riesgos y la planificación preventiva, siempre que se cumplan los requisitos legales aplicables."]},{"t":"p","x":["Aquest document ha de ser comprensible, pràctic i adaptat als riscos reals de l’activitat. La simplificació documental no elimina l’obligació de protegir la plantilla ni de mantenir actualitzada la gestió preventiva.","Este documento debe ser comprensible, práctico y adaptado a los riesgos reales de la actividad. La simplificación documental no elimina la obligación de proteger a la plantilla ni de mantener actualizada la gestión preventiva."]}],"acts":[],"videos":[]},{"num":4,"kind":"theory","title":["Analogia: el manual d’organització d’un equip","Analogía: el manual de organización de un equipo"],"nodes":[{"t":"p","x":["Imagina un equip esportiu. Per funcionar correctament, necessita objectius, responsabilitats definides, recursos i procediments compartits.","Imagina un equipo deportivo. Para funcionar correctamente, necesita objetivos, responsabilidades definidas, recursos y procedimientos compartidos."]},{"t":"p","x":["El Pla de Prevenció és semblant a aquest manual d’organització: estableix com s’organitza l’equip per treballar amb seguretat. L’avaluació de riscos permet identificar els problemes que poden aparèixer, mentre que la planificació preventiva determina què s’ha de fer, qui ho ha de fer i quan.","El Plan de Prevención es parecido a este manual de organización: establece cómo se organiza el equipo para trabajar con seguridad. La evaluación de riesgos permite identificar los problemas que pueden aparecer, mientras que la planificación preventiva determina qué se debe hacer, quién lo debe hacer y cuándo."]},{"t":"p","x":["Un document ben redactat no garanteix, per si mateix, que es treballi de manera segura. És necessari aplicar-ne les instruccions en la pràctica.","Un documento bien redactado no garantiza, por sí mismo, que se trabaje de manera segura. Es necesario aplicar sus instrucciones en la práctica."]}],"acts":[],"videos":[],"visuals":[{"type":"cards","items":[{"i":"doc","s":"info","x":["Pla de Prevenció","Plan de Prevención"],"d":["Manual d'organització de l'equip","Manual     return overlayShell("progress", t("progTitle"), h("div", null, h("p", null, h("strong", null, t("sessionsDone") + ": " + full + " / " + C.blocks.length)), h("div", { class: "tablewrap" }, tb)));
  }

  /* ---------------- informe ---------------- */
  function collect() {
    var rows = [], auto = { done: 0, n: 0, sc: 0, mx: 0 }, teacherN = 0, classN = 0, pending = [], review = [], doneN = 0, total = 0, sessionsFull = 0;
    C.blocks.forEach(function (b) {
      if (blockProgress(b).state === "full") sessionsFull++;
      b.acts.forEach(function (a) {
        total++;
        var s = S.a[a.id] || {}, fam = family(a), r = { a: a, b: b, fam: fam, s: s, done: isDone(a) };
        if (r.done) doneN++;
        if (fam === "auto") {
          auto.n++;
          if (s.attempts) { auto.done++; auto.sc += s.best.sc; auto.mx += s.best.mx; if (pct(s.best.sc, s.best.mx) < 50) review.push(r); }
          else pending.push(r);
        } else if (fam === "teacher") {
          teacherN++;
          if (s.status !== "lliu" && !s.tReviewed) pending.push(r);
          else if (!s.tReviewed) pending.push(r);
        } else { classN++; if (!s.done) pending.push(r); }
        rows.push(r);
      });
    });
    return { rows: rows, auto: auto, teacherN: teacherN, classN: classN, pending: pending, review: review, doneN: doneN, total: total, sessionsFull: sessionsFull };
  }
  function stateLabel(r) {
    if (r.fam === "auto") return r.s.attempts ? t("completed") : t("rNotDone");
    if (r.fam === "class") return (r.s.done ? t("classDone") : t("st_pend")) + (r.s.tReviewed ? " · " + t("st_rev") : "");
    return r.s.tReviewed ? t("st_rev") : (r.s.status === "lliu" ? t("st_lliu") + " · " + t("notReviewed") : t("st_pend"));
  }
  function typeLabel(r) { return r.fam === "auto" ? t("auto") : r.fam === "class" ? t("klass") : t("teacher"); }
  function raTxt(a) { return a.ra || a.ce ? (a.ra || "") + (a.ce ? " · CE " + a.ce : "") : t("pending"); }
  function answersOf(r) {
    var a = r.a, s = r.s, out = [];
    if (r.fam === "teacher") {
      (a.fields || []).forEach(function (f, i) { if (s.text && s.text[i]) out.push(T(f) + ": " + s.text[i]); });
      if (a.grid && s.grid) s.grid.forEach(function (row, ri) { if (row && row.some(Boolean)) out.push("#" + (ri + 1) + " " + a.grid.cols.map(function (c, ci) { return T(c) + ": " + (row[ci] || "—"); }).join(" | ")); });
    } else if (r.fam === "class") { if (s.obs) out.push(t("classObs") + ": " + s.obs); }
    return out;
  }
  var TAG = { auto: "[AUTO]", t: "[DOCENT]", s: "[ALUMNE]" };
  function tagT() { return S.lang === "es" ? "[DOCENTE]" : "[DOCENT]"; }
  function tagS() { return S.lang === "es" ? "[ALUMNO]" : "[ALUMNE]"; }

  function vidLabel(k) {
    var m = k.match(/^(B\d\d)-v(\d+)-(\d+)$/); if (!m) return k;
    var b = C.blocks.filter(function (x) { return x.id === m[1]; })[0]; if (!b) return k;
    var s = b.sections.filter(function (x) { return String(x.num) === m[2]; })[0];
    var v = s && s.videos && s.videos[+m[3]];
    return v ? m[1] + " — " + T(v.title) : k;
  }
  function reportPlain(d) {

    L2.push(t("rId").toUpperCase());

    L2.push(t("rGenerated") + ": " + new Date().toLocaleString(S.lang === "es" ? "es-ES" : "ca-ES"));
    L2.push(""); L2.push(t("rAutoLegend"));

        var a = r.a, s = r.s;

            L2.push("    " + TAG.auto + " " + t("best") + ": " + s.best.sc + "/" + s.best.mx + " (" + fmtPct(pct(s.best.sc, s.best.mx)) + ") · " + t("attempts") + ": " + s.attempts);
          } else L2.push("    " + TAG.auto + " " + t("rNotDone"));
        } else {
          L2.push("    " + t("rState") + ": " + stateLabel(r));
          answersOf(r).forEach(function (x) { L2.push("    " + tagS() + " " + x.replace(/\n/g, "\n      ")); });
          L2.push("    " + tagT() + " " + t("rTeacherGrade") + ": " + (s.tGrade || t("notReviewed")) + (s.tComment ? " · " + t("rTeacherComment") + ": " + s.tComment : ""));
        }

    });
    var refl = Object.keys(S.vids).filter(function (k) { return S.vids[k]; });
    if (refl.length) { L2.push(""); L2.push(t("rReflections") + " " + tagS()); refl.forEach(function (k) { L2.push("- " + vidLabel(k) + ": " + S.vids[k]); }); }

    L2.push(t("rAutoSummary") + ": " + (d.auto.mx ? d.auto.sc + "/" + d.auto.mx + " (" + fmtPct(pct(d.auto.sc, d.auto.mx)) + ")" : "—") + " " + TAG.auto);
    L2.push(t("rNoGlobal"));
    L2.push(t("rReview") + ":"); if (d.review.length) d.review.forEach(function (r) { L2.push("  · " + r.b.id + " — " + T(r.a.title)); }); else L2.push("  " + t("rNoReview"));
    L2.push(t("rPendList") + ":"); if (d.pending.length) d.pending.forEach(function (r) { L2.push("  · " + r.b.id + " — " + T(r.a.title) + " (" + stateLabel(r) + ")"); }); else L2.push("  " + t("rNone"));
    L2.push(t("rFinalObs") + ": " + (S.finalObs || "—"));
    L2.push(hr); L2.push(t("notice"));
    return L2.join("\n");
  }

  function reportHTML(d) {
    var box = h("div", { class: "rep" });
    box.appendChild(h("p", { class: "legend" }, t("rAutoLegend")));
    box.appendChild(h("h3", null, t("rId")));
    var idt = h("table", null, h("tbody", null,
      h("tr", null, h("th", null, t("name")), h("td", null, S.student.name + " " + tagS())),
      h("tr", null, h("th", null, t("group")), h("td", null, S.student.group + " " + tagS())),
      h("tr", null, h("th", null, t("date")), h("td", null, S.student.date || "")),
      h("tr", null, h("th", null, t("rDay")), h("td", null, t("day") + " " + C.day + " · " + C.blocks.map(function (b) { return b.id; }).join(", ") + " (" + C.uds.map(function (u) { return u.id + " " + T(u.title); }).join("; ") + ")")),
      S.student.notes ? h("tr", null, h("th", null, t("obs")), h("td", null, S.student.notes)) : null,
      h("tr", null, h("th", null, t("rGenerated")), h("td", null, new Date().toLocaleString(S.lang === "es" ? "es-ES" : "ca-ES")))));
    box.appendChild(h("div", { class: "tablewrap" }, idt));
    box.appendChild(h("h3", null, t("rProg") + " ", h("span", { class: "src-a" }, TAG.auto)));
    box.appendChild(h("ul", null,
      h("li", null, t("sessionsDone") + ": " + d.sessionsFull + " / " + C.blocks.length),
      h("li", null, t("actsDone") + ": " + d.doneN + " / " + d.total + " · " + t("rPending") + ": " + (d.total - d.doneN)),
      h("li", null, t("rAutoDone") + ": " + d.auto.done + " / " + d.auto.n),
      h("li", null, t("rTeacherNeed") + ": " + d.teacherN), h("li", null, t("rClass") + ": " + d.classN)));
    box.appendChild(h("h3", null, t("rRes")));
    C.blocks.forEach(function (b) {
      box.appendChild(h("h4", null, b.id + " · " + T(b.title)));
      var tb = h("table"), tbody = h("tbody");
      tb.appendChild(h("thead", null, h("tr", null, h("th", null, t("rAct")), h("th", null, "RA/CE"), h("th", null, t("rType")), h("th", null, t("rRight") + " / " + t("rWrongs")), h("th", null, t("rScore")), h("th", null, t("rPct")), h("th", null, t("rBest")), h("th", null, t("rState")))));
      d.rows.filter(function (r) { return r.b === b; }).forEach(function (r) {
        var a = r.a, s = r.s, auto = r.fam === "auto" && s.attempts;
        tbody.appendChild(h("tr", null,
          h("td", null, T(a.title), h("br"), h("small", null, a.origin === "manual" ? t("fromManual") : t("complementary"))),
          h("td", null, raTxt(a)), h("td", null, typeLabel(r)),
          h("td", null, auto ? h("span", { class: "src-a" }, s.last.sc + " / " + (s.last.mx - s.last.sc)) : "—"),
          h("td", null, auto ? h("span", { class: "src-a" }, s.last.sc + "/" + s.last.mx) : (r.fam !== "auto" ? h("span", { class: "src-t" }, s.tGrade ? tagT() + " " + s.tGrade : t("notReviewed")) : "—")),
          h("td", null, auto ? fmtPct(pct(s.last.sc, s.last.mx)) : "—"),
          h("td", null, auto ? s.best.sc + "/" + s.best.mx + " (" + fmtPct(pct(s.best.sc, s.best.mx)) + ") · " + s.attempts + "×" : "—"),
          h("td", null, stateLabel(r))));
        var ans = answersOf(r);

          if (ans.length) { cell.appendChild(h("strong", null, t("rAnswers") + " " + tagS())); ans.forEach(function (x) { cell.appendChild(h("div", { class: "ans" }, x)); }); }
          if (s.tComment) cell.appendChild(h("div", { class: "ans" }, h("span", { class: "src-t" }, tagT() + " " + t("rTeacherComment") + ": "), s.tComment));
          tbody.appendChild(h("tr", null, cell));
        }
      });
      tb.appendChild(tbody);
      box.appendChild(h("div", { class: "tablewrap" }, tb));
    });
    var refl = Object.keys(S.vids).filter(function (k) { return S.vids[k]; });
    if (refl.length) {
      box.appendChild(h("h4", null, t("rReflections") + " " + tagS()));
      refl.forEach(function (k) { box.appendChild(h("div", { class: "ans" }, vidLabel(k) + ": " + S.vids[k])); });
    }
    box.appendChild(h("h3", null, t("rSyn")));
    box.appendChild(h("p", null, h("strong", null, t("rAutoSummary") + ": "), h("span", { class: "src-a" }, (d.auto.mx ? d.auto.sc + "/" + d.auto.mx + " (" + fmtPct(pct(d.auto.sc, d.auto.mx)) + ")" : "—") + " " + TAG.auto)));
    box.appendChild(h("p", { class: "hint" }, t("rNoGlobal")));
    box.appendChild(h("p", null, h("strong", null, t("rReview") + ":")));
    box.appendChild(d.review.length ? h("ul", null, d.review.map(function (r) { return h("li", null, r.b.id + " — " + T(r.a.title)); })) : h("p", null, t("rNoReview")));
    box.appendChild(h("p", null, h("strong", null, t("rPendList") + ":")));
    box.appendChild(d.pending.length ? h("ul", null, d.pending.map(function (r) { return h("li", null, r.b.id + " — " + T(r.a.title) + " (" + stateLabel(r) + ")"); })) : h("p", null, t("rNone")));
    var fo = h("textarea", { id: "finalobs", rows: 3 }); fo.value = S.finalObs || "";
    fo.addEventListener("input", function () { S.finalObs = fo.value; save(); var pv = document.getElementById("finalobs-print"); if (pv) pv.textContent = fo.value; });
    box.appendChild(h("div", { class: "field" }, h("label", { for: "finalobs" }, t("rFinalObs")), fo, h("div", { id: "finalobs-print", class: "ans", style: "display:none" }, S.finalObs || "")));
    box.appendChild(h("p", { class: "hint" }, t("notice")));
    box.appendChild(h("textarea", { id: "copyfallback", readonly: true, "aria-label": t("copy") }));
    return box;
  }

  function reportOverlay() {
    var d = collect();
    var title = t("rTitle") + " — " + (S.student.name || "") + " — " + t("day") + " " + C.day;
    var extra = [
      h("button", { type: "button", class: "btn", onclick: printReport }, t("print")),
      h("button", { type: "button", class: "btn ghost", onclick: copyReport }, t("copy"))];
    return overlayShell("report", title, reportHTML(d), extra);
  }
  function validReport() {
    if (!S.student.name.trim() || !S.student.group.trim()) {
      toast(t("needId")); go(C.blocks[0].id);
      var el = document.getElementById(!S.student.name.trim() ? "st-name" : "st-group"); if (el) el.focus();
      return false;
    }
    if (collect().doneN === 0 && !window.confirm(t("emptyWarn"))) return false;
    return true;
  }
  function generateReport() { if (validReport()) openOv("report"); }
  function printReport() {
    var fo = document.getElementById("finalobs"), pv = document.getElementById("finalobs-print");
    if (fo && pv) { pv.textContent = fo.value || "—"; pv.style.display = ""; fo.parentNode.querySelector("textarea").style.display = "none"; }

  }

    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, function () {
        fb.value = txt; fb.style.display = "block"; fb.select();

        fallback();
      });
    } else {
      fb.value = txt; fb.style.display = "block"; fb.select();
      try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }

    }
  }

  render();
})();
